[project]
name = "pdf-based-rag"
version = "0.1.0"
description = "A lightweight PDF-based RAG app with CLI and Streamlit interfaces."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chromadb>=1.3,<2",
    "groq>=0.30.0",
    "numpy>=1.26,<3",
    "pdfplumber>=0.11.0,<1",
    "pymupdf>=1.24.10",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=3.0.1,<4",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
