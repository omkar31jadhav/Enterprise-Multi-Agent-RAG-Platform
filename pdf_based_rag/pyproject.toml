[project]
name = "pdf-based-rag"
version = "0.1.0"
description = "A lightweight PDF-based RAG app with CLI and Streamlit interfaces."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chromadb>=1.3,<2",
    "groq>=0.30.0",
    "langchain>=1.2,<2",
    "numpy>=1.26,<3",
    "pdfplumber>=0.11.0,<1",
    "pymupdf>=1.24.10",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=3.0.1,<4",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "mypy>=1.9,<2",
]
mlflow = [
    "mlflow>=2.5,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
show_error_codes = true
namespace_packages = true
mypy_path = ["."]
files = ["services", "rag", "vectorstores", "database", "ml", "config", "models"]
